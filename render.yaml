# Render Blueprint for the hosted Visit environment (docs/architecture/production-hosting.md).
# Every resource is on Render's free plan; upgrading is a plan change here, not a rebuild.
# Regions are immutable after creation: Frankfurt is Render's closest region to Israel.
# Secrets are never written here: `sync: false` values are entered once in the Render dashboard.

services:
  - type: web
    name: visit-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Ready only when the database (with migrations applied) and Redis answer.
    healthCheckPath: /health/ready
    # Deploys only after the GitHub "Quality gates" checks pass on main.
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - Dockerfile
        - package-lock.json
        - apps/api/**
        - packages/contracts/**
    domains:
      - api.my-visit.xyz
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_HOST
        value: 0.0.0.0
      - key: API_PORT
        value: 3000
      # Render routes traffic to the port named by PORT.
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: visit-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: visit-redis
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: WEB_APP_URL
        value: https://app.my-visit.xyz
      - key: EMAIL_DELIVERY_MODE
        value: resend
      - key: EMAIL_FROM
        value: Visit <login@mail.my-visit.xyz>
      - key: EMAIL_API_KEY
        sync: false
      - key: SMS_DELIVERY_MODE
        value: disabled
      # Empty: Render's proxy addresses are not published, so client IPs are not trusted from headers.
      - key: TRUSTED_PROXY_CIDRS
        value: ""

  - type: keyvalue
    name: visit-redis
    plan: free
    region: frankfurt
    # Empty: Render's private network only. The API reaches it there; nothing outside can connect.
    ipAllowList: []

  - type: web
    name: visit-web
    runtime: static
    autoDeployTrigger: checksPass
    buildCommand: npm ci && npm run export:web --workspace @visit/mobile
    staticPublishPath: ./apps/mobile/dist
    buildFilter:
      paths:
        - package-lock.json
        - apps/mobile/**
        - packages/contracts/**
    domains:
      - app.my-visit.xyz
    envVars:
      - key: NODE_VERSION
        value: 22
      # Baked into the bundle at build time: a change needs a rebuild of this site.
      - key: EXPO_PUBLIC_API_URL
        value: https://api.my-visit.xyz
    # Files that exist (the bundle, icons, manifest) are served as they are; every other path is a route.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    # One rule per header name: Render does not document which of two overlapping rules wins.
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000

databases:
  - name: visit-db
    plan: free
    region: frankfurt
    # Matches docker-compose.yml and CI, so a pg_dump/pg_restore image of the same version fits.
    postgresMajorVersion: "16"
    databaseName: visit
    user: visit
    # Empty: private network only. A dump or restore allows one /32 address for its duration
    # (docs/architecture/production-hosting.md); otherwise a leaked External URL would open the data to anyone.
    ipAllowList: []
